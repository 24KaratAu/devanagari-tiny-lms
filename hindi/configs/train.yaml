# Model H training configuration — Google Colab (T4), Drive-mounted checkpoints.
run_name: model_h_hindi
model_config: hindi/configs/model.yaml
seed: 42

data:
  # Written by src/data/pack_tokens.py — flat uint16 token streams.
  train_bin: /content/drive/MyDrive/24KaratAu/hindi/tokens/hindi_train.bin
  val_bin:   /content/drive/MyDrive/24KaratAu/hindi/tokens/hindi_val.bin
  test_bin:  /content/drive/MyDrive/24KaratAu/hindi/tokens/hindi_test.bin

optim:
  optimizer: adamw
  lr: 3.0e-4              # peak LR, reached at the end of warmup
  betas: [0.9, 0.95]      # GPT-style; beta2=0.95 suits short runs
  eps: 1.0e-8
  weight_decay: 0.1       # applied to matmul weights only, not biases/LayerNorm
  grad_clip: 1.0

schedule:
  type: cosine
  warmup_steps: 500
  min_lr: 3.0e-5          # cosine floor = peak / 10

train:
  batch_size: 64          # 64 x 512 = 32,768 tokens per step
  grad_accum: 1           # raise to 2 (and halve batch_size) if the T4 OOMs
  max_steps: 14329        # one pass over 469,537,746 train tokens (incl. <eos>)
  precision: fp16         # T4 has no bf16; AMP + GradScaler
  compile: false          # torch.compile is not worth the warmup on a 4-day budget

eval:
  every: 500              # steps between validation passes
  val_tokens: 2000000     # fixed 2M-token slice during training; full val at the end
  batch_size: 64

checkpoint:
  # Written straight to the Drive mount — /content/ is wiped on disconnect.
  dir: /content/drive/MyDrive/24KaratAu/hindi/checkpoints
  save_latest_every: 500  # overwrites checkpoint_latest.pt
  save_milestone_every: 2000
  keep_best: true         # checkpoint_best.pt, on validation-loss improvement

log:
  jsonl: hindi/logs/train.jsonl   # loss curve; committed, not Drive-only
  every: 20
